name: Clinical focus real browser check
on:
  push:
    paths:
      - 'tests/e2e/clinical_focus.py'
      - '.github/workflows/clinical-focus-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  clinical-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build actual F# SAFE bundle
        run: dotnet run -- Bundle
      - name: Install browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Serve compiled application
        run: |
          cd deploy
          ASPNETCORE_URLS=http://127.0.0.1:8080 nohup dotnet Server.dll > /tmp/clinical-focus-server.log 2>&1 &
          for i in $(seq 1 90); do
            if curl --silent --fail http://127.0.0.1:8080/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/clinical-focus-server.log
          exit 1
      - name: Test focus and detail views with live model calculations
        run: python tests/e2e/clinical_focus.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clinical-focus-real-safe-screenshots
          path: captures/*.png
          if-no-files-found: warn
          retention-days: 30
      - if: failure()
        run: cat /tmp/clinical-focus-server.log || true
