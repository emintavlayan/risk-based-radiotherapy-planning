name: Catalogue browser integration
on:
  workflow_dispatch:
  push:
    paths:
      - 'tests/e2e/catalogue_browser.py'
      - '.github/workflows/catalogue-browser.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build F# SAFE server and Fable client
        run: dotnet run -- Bundle
      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Start actual compiled SAFE application
        run: |
          cd deploy
          ASPNETCORE_URLS=http://127.0.0.1:8080 nohup dotnet Server.dll > /tmp/catalogue-server.log 2>&1 &
          for i in $(seq 1 90); do
            if curl --silent --fail http://127.0.0.1:8080/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/catalogue-server.log
          exit 1
      - name: Run real catalogue UI against F# remoting server
        run: python tests/e2e/catalogue_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scientifically-evaluated-model-catalogue-screenshots
          path: captures/*.png
          if-no-files-found: warn
      - if: failure()
        run: cat /tmp/catalogue-server.log || true
