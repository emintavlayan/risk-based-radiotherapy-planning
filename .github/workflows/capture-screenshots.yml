name: Capture actual SAFE application screenshots
on:
  push:
    paths:
      - 'scripts/capture_safe_screenshots.py'
      - '.github/workflows/capture-screenshots.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build actual SAFE server and browser client
        run: dotnet run -- Bundle
      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Start compiled SAFE server
        run: |
          cd deploy
          ASPNETCORE_URLS=http://127.0.0.1:8080 nohup dotnet Server.dll > /tmp/safe-server.log 2>&1 &
          for i in $(seq 1 90); do
            if curl --silent --fail http://127.0.0.1:8080/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/safe-server.log
          exit 1
      - name: Capture genuine browser screenshots and verify live NTCP calculation
        run: python scripts/capture_safe_screenshots.py
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-safe-app-screenshots
          path: captures/*.png
          if-no-files-found: warn
          retention-days: 30
      - name: Show server logs on failure
        if: failure()
        run: cat /tmp/safe-server.log || true
